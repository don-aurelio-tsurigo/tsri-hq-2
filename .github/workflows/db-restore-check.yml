name: DB Restore-Probe

on:
  schedule:
    # Am 2. jedes Monats, 05:00 UTC
    - cron: "0 5 2 * *"
  workflow_dispatch:

concurrency:
  group: db-restore-check
  cancel-in-progress: false

jobs:
  restore-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Wegwerf-Datenbank nur für diesen Lauf, mit pgvector
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_PASSWORD: restore
          POSTGRES_DB: restore
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install pg_restore
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -yq postgresql-client-18
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"

      - run: npm ci --ignore-scripts

      - name: Restore-Probe
        env:
          RESTORE_DATABASE_URL: postgresql://postgres:restore@localhost:5432/restore
          BACKUP_R2_ACCOUNT_ID: ${{ secrets.BACKUP_R2_ACCOUNT_ID }}
          BACKUP_R2_BUCKET_NAME: ${{ secrets.BACKUP_R2_BUCKET_NAME }}
          BACKUP_R2_ENDPOINT: ${{ secrets.BACKUP_R2_ENDPOINT }}
          BACKUP_R2_ACCESS_KEY_ID: ${{ secrets.BACKUP_R2_ACCESS_KEY_ID }}
          BACKUP_R2_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_R2_SECRET_ACCESS_KEY }}
        run: npx tsx scripts/db-restore-check.ts
